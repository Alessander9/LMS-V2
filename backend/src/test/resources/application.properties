application.security.jwt.expiration=1800000
application.storage.path=${STORAGE_PATH:target/test-uploads}
application.api.base-url=${API_BASE_URL:http://localhost:8081}
application.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
SEED_DEFAULT_USERS=true
SEED_ADMIN_EMAIL=${QA_ADMIN_EMAIL}
