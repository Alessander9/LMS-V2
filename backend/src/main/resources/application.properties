# Application properties
spring.application.name=backend
server.port=8081

# Database connection is supplied by the runtime environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}


# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# File upload settings for Materiales (100MB Limit)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Logging levels
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:WARN}

# JWT expiration for access tokens (30 minutes)
application.security.jwt.expiration=${JWT_EXPIRATION:1800000}
application.security.jwt.secret-key=${JWT_SECRET}

# Spring Boot Actuator settings
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}

# Central storage path setting (default relative to system's current directory)
application.storage.path=${STORAGE_PATH}

# Public base URLs used to build absolute links in generated entities
application.api.base-url=${API_BASE_URL}
application.frontend.base-url=${FRONTEND_BASE_URL}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Chatbot settings
application.chatbot.groq-api-key=${GROQ_API_KEY:}
application.chatbot.groq-model=${GROQ_MODEL:llama-3.1-8b-instant}
application.chatbot.gemini-api-key=${GEMINI_API_KEY:}
application.chatbot.gemini-model=${GEMINI_MODEL:gemini-3.5-flash}
application.chatbot.openrouter-api-key=${OPENROUTER_API_KEY:}
application.chatbot.openrouter-model=${OPENROUTER_MODEL:openrouter/free}
application.chatbot.context-path=${CHATBOT_CONTEXT_PATH:../infoInsteip.md}

